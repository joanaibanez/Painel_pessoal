# =============================================================================
# Fontes de notícias monitoradas pelo pipeline.
#
# Critérios de curadoria (neutralidade):
#   1. Diversidade: veículo público (Agência Brasil), grandes redações privadas
#      (g1, Folha, Estadão, CNN Brasil) e um veículo estrangeiro em português
#      (BBC News Brasil). Nenhuma fonte com linha editorial declaradamente
#      partidária.
#   2. Somente feeds de editorias factuais. Colunas, blogs e opinião são
#      removidos pelos filtros abaixo.
#   3. Importância = nº de fontes independentes que noticiaram o mesmo fato.
#      Uma manchete só vira "destaque" quando várias redações a cobrem.
#
# Para adicionar uma fonte: crie um bloco [[fontes]] e liste os feeds.
# Categorias válidas: geral, economia, politica, saude, educacao,
#                     ciencia_tecnologia, mundo
# =============================================================================

[filtros]
# Trechos de URL que indicam conteúdo opinativo, patrocinado ou de baixo valor
# informativo. Comparação sem diferenciar maiúsculas.
url_excluir = [
    "/opiniao", "/colunas/", "/coluna/", "/colunistas/", "/blogs/", "/blog/",
    "/editorial", "/artigo/", "/analise/", "/podcast", "/video/", "/videos/",
    "/patrocinado", "/publieditorial", "/conteudo-de-marca", "/horoscopo",
    "/bbb", "/novelas/", "/celebridades/", "/famosos/", "/pop-arte/",
    "/loterias/", "/quiz/", "/viva/", "/entretenimento/", "/esportes/",
    "/esporte/", "ge.globo.com", "/futebol/",
]

# Termos no título (normalizados, sem acento) que indicam opinião, propaganda
# ou entretenimento. Correspondência por palavra/expressão inteira.
# Evite palavras ambíguas (ex.: "artigo", "análise") que geram falso positivo.
titulo_excluir = [
    "opiniao", "editorial", "podcast", "ao vivo", "assista", "veja fotos",
    "horoscopo", "bbb", "big brother", "novela", "reality show", "famosos",
    "celebridade", "mega sena", "lotofacil", "quina", "loteria", "palpite",
    "black friday", "patrocinado", "publieditorial",
]

[[fontes]]
slug = "agencia-brasil"
nome = "Agência Brasil"
site_url = "https://agenciabrasil.ebc.com.br"
feeds = [
