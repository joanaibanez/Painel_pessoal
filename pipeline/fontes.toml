    { categoria = "economia",  url = "https://agenciabrasil.ebc.com.br/rss/economia/feed.xml" },
    { categoria = "politica",  url = "https://agenciabrasil.ebc.com.br/rss/politica/feed.xml" },
    { categoria = "saude",     url = "https://agenciabrasil.ebc.com.br/rss/saude/feed.xml" },
    { categoria = "educacao",  url = "https://agenciabrasil.ebc.com.br/rss/educacao/feed.xml" },
    { categoria = "mundo",     url = "https://agenciabrasil.ebc.com.br/rss/internacional/feed.xml" },
]

