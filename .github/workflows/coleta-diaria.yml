name: Coleta diária de notícias

on:
  schedule:
    # 07:00 em Brasília (America/Sao_Paulo = UTC-3, sem horário de verão).
    # O cron do GitHub é sempre UTC; atrasos de alguns minutos são normais.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Somente testar a coleta (não grava no banco)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    name: Coletar e gravar no Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Coletar (dry-run)
        if: ${{ inputs.dry_run }}
        run: python -m pipeline --dry-run

      - name: Coletar e gravar
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RETENCAO_DIAS: "180"
          JANELA_HORAS: "30"
        run: python -m pipeline
